name: Fork formatter validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: fork-formatter-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  formatter:
    name: Formatter tests, lint, and types
    if: github.repository == 'glitchwizard/grafana' && github.event.pull_request.number == 3 && github.event.pull_request.head.repo.full_name == 'glitchwizard/grafana'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Execute the reviewed head with a read-only token and no persisted credentials.
      # This fork-only job does not use Grafana secrets or organization runners.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Run formatter regression suite
        env:
          CI: 'true'
        run: yarn test packages/grafana-data/src/valueFormats/dateTimeFormatters.test.ts --watch=false --watchAll=false --runInBand
      - name: Lint changed files
        run: yarn exec eslint packages/grafana-data/src/valueFormats/dateTimeFormatters.ts packages/grafana-data/src/valueFormats/dateTimeFormatters.test.ts
      - name: Check formatting
        run: yarn exec prettier --check packages/grafana-data/src/valueFormats/dateTimeFormatters.ts packages/grafana-data/src/valueFormats/dateTimeFormatters.test.ts
      - name: Check package types
        run: yarn workspace @grafana/data typecheck
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
